<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayzo — App splash screen</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Inter:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sp-disp{font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif;letter-spacing:-0.03em}
@keyframes sp-mark{0%{opacity:0;transform:scale(.3) rotate(-25deg)}12%{opacity:1;transform:scale(1.08) rotate(3deg)}18%,88%{opacity:1;transform:none}100%{opacity:0;transform:scale(.9)}}
@keyframes sp-draw{0%,8%{stroke-dashoffset:100}30%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes sp-ltr{0%,14%{opacity:0;transform:translateY(70%)}26%,88%{opacity:1;transform:none}100%{opacity:0}}
@keyframes sp-tag{0%,30%{opacity:0;transform:translateY(10px)}40%,88%{opacity:1;transform:none}100%{opacity:0}}
@keyframes sp-bar{0%,35%{width:0}85%,100%{width:100%}}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@keyframes sp-ring{0%{transform:scale(.6);opacity:0}20%{opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes sp-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.sp-mark{animation:sp-mark 5s cubic-bezier(.2,.8,.3,1) infinite}
.sp-draw{stroke-dasharray:100;animation:sp-draw 5s cubic-bezier(.65,0,.35,1) infinite}
.sp-ltr{display:inline-block;animation:sp-ltr 5s cubic-bezier(.2,.7,.2,1) infinite}
.sp-l2{animation-delay:.06s}.sp-l3{animation-delay:.12s}.sp-l4{animation-delay:.18s}.sp-l5{animation-delay:.24s}
.sp-tag{animation:sp-tag 5s ease infinite}
.sp-bar{animation:sp-bar 5s cubic-bezier(.65,0,.35,1) infinite}
.sp-spin{animation:sp-spin 16s linear infinite}
.sp-spin-r{animation:sp-spin 24s linear infinite reverse}
.sp-ring{animation:sp-ring 2.5s ease-out infinite}
.sp-ring2{animation-delay:1.25s}
.sp-float{animation:sp-float 5s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.sp-draw{stroke-dashoffset:0}}
</style>
<style>body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#05070F}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background-color:#0B1020;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:39px 39px;position:relative;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center">

<div aria-hidden="true" style="position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(59,91,255,.32),rgba(59,91,255,0) 65%);top:170px;left:-15px"></div>

<div class="sp-spin" aria-hidden="true" style="position:absolute;width:300px;height:300px;top:222px;left:45px;border-radius:50%;border:1.5px dashed rgba(215,255,61,.28)">
<span style="position:absolute;top:-11px;left:139px;width:22px;height:22px;border-radius:50%;background:#D7FF3D;display:flex;align-items:center;justify-content:center">
<svg width="12" height="12" viewBox="0 0 24 24" fill="#0B1020" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"></path></svg>
</span>
</div>
<div class="sp-spin-r" aria-hidden="true" style="position:absolute;width:210px;height:210px;top:267px;left:90px;border-radius:50%;border:1px solid rgba(255,255,255,.12)">
<span style="position:absolute;bottom:-5px;left:40px;width:10px;height:10px;border-radius:50%;background:#3B5BFF"></span>
</div>

<div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:-40px">
<div style="position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center">
<span class="sp-ring" aria-hidden="true" style="position:absolute;inset:0;border-radius:36px;border:2px solid rgba(215,255,61,.6)"></span>
<span class="sp-ring sp-ring2" aria-hidden="true" style="position:absolute;inset:0;border-radius:36px;border:2px solid rgba(215,255,61,.6)"></span>
<div class="sp-mark" style="width:112px;height:112px;border-radius:36px;background:#D7FF3D;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(215,255,61,.25)">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0B1020" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Wayzo logo"><path class="sp-draw" pathLength="100" d="M3.5 17.5c3-8.5 6-10.5 8.5-10.5s3 3 5 3 3.5-2.5 3.5-2.5"></path></svg>
</div>
</div>
<div class="sp-disp" style="font-size:60px;font-weight:800;line-height:1;overflow:hidden;padding-bottom:6px"><span class="sp-ltr">w</span><span class="sp-ltr sp-l2">a</span><span class="sp-ltr sp-l3">y</span><span class="sp-ltr sp-l4">z</span><span class="sp-ltr sp-l5">o</span></div>
<div class="sp-tag" style="font-size:16px;font-weight:500;color:rgba(255,255,255,.75)">Upload tickets. Travel easy.</div>
</div>

<div style="position:absolute;bottom:72px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px">
<div style="width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden"><div class="sp-bar" style="height:100%;background:#D7FF3D;border-radius:4px"></div></div>
<div class="sp-float" style="font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)">Planning your next trip</div>
</div>
</div>
</body>
</html>
